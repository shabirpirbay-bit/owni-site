<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OWNI — Le gestionnaire intelligent de vos achats</title>
  <style>
    :root {
      --primary: #00D4C4;
      --navy: #0B132B;
      --background: #F5F7FA;
      --gray: #6B7280;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--background);
      color: var(--navy);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
    }
    .logo {
      font-size: 2.5rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      color: var(--navy);
    }
    .logo span { color: var(--primary); }
    .tagline {
      margin-top: 1rem;
      font-size: 1.15rem;
      color: var(--gray);
      max-width: 32rem;
      line-height: 1.6;
    }
    .badge {
      margin-top: 2rem;
      display: inline-block;
      background: var(--primary);
      color: var(--navy);
      font-weight: 600;
      padding: 0.5rem 1.25rem;
      border-radius: 999px;
      font-size: 0.95rem;
    }
    footer {
      padding: 1.5rem;
      text-align: center;
      font-size: 0.85rem;
      color: var(--gray);
    }
    footer a { color: var(--gray); }
  </style>
</head>
<body>
  <main>
    <div class="logo">OWNI<span>.</span></div>
    <p class="tagline">Le gestionnaire intelligent de tout ce que vous achetez.
    Factures, garanties, délais de retour — automatiquement, sans saisie manuelle.</p>
    <div class="badge">Bientôt disponible</div>
  </main>
  <footer>
    <a href="/privacy.html">Politique de confidentialité</a> · © 2026 OWNI
  </footer>
</body>
</html>
